<style>
/* The Void: Kody's private idea dump on spitz.dev. Same sign-in, same mono font as the dashboard,
   amethyst instead of orange. No due dates, no streaks, no progress. Ideas are stored and left alone. */
:root{
  /* spitz.dev color system (design/tokens.css): shared neutrals, The Void violet, status colors */
  --bg:#0B0C14; --panel:#161822; --panel2:#1D202E; --line:#35394A; --ink:#F2F0F8; --muted:#979BAC;
  --am:#AD5CFF; --am2:#CEADFF; --ok:#8ED8B1; --warn:#E9BD70; --bad:#FF8293; --focus:#FFE2AA; --on-accent:#0B0C14;
}
*{ box-sizing:border-box; }
html,body{ margin:0; overflow-x:hidden; max-width:100%; color:var(--ink); font:14px/1.55 'JetBrains Mono',ui-monospace,monospace; }
body{ min-height:100vh; background:
  radial-gradient(60rem 36rem at 50% -12rem, rgba(173,92,255,.16), transparent 70%),
  radial-gradient(30rem 22rem at 100% 100%, rgba(173,92,255,.06), transparent 70%), var(--bg); background-attachment:fixed; }
button,input,textarea,select{ font:inherit; color:inherit; }
a{ color:var(--am2); }
::selection{ background:var(--am); color:var(--on-accent); }
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
.wrap{ max-width:760px; margin:0 auto; padding:0 16px 64px; }
header{ display:flex; align-items:center; gap:10px; padding:14px 0; }
header .back{ color:var(--muted); text-decoration:none; font-size:12px; border:1px solid var(--line); border-radius:6px; padding:5px 10px; }
header .back:hover{ color:var(--am2); border-color:var(--am); }
.grow{ flex:1; }
header .mark{ width:40px; height:auto; margin-left:auto; }
.sub{ color:var(--muted); font-size:12px; }
/* hero: the portal (custom line art, void/portal.png) inside a slowly turning dashed ring. */
.hero{ text-align:center; padding:18px 0 22px; }
/* black hole (decoration only, aria-hidden): a dark shadow with a thin photon ring and a tilted violet accretion disk
   behind the portal, plus a faint, far-off second one and a sparse starfield. Disk dashes drift slowly; still under reduced motion. */
.sky{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:-1; }
.neb{ position:fixed; inset:0; pointer-events:none; z-index:-2;
  background:radial-gradient(38rem 16rem at 18% 30%, rgba(173,92,255,.10), transparent 70%),
    radial-gradient(30rem 14rem at 86% 22%, rgba(239,117,200,.06), transparent 70%),
    radial-gradient(44rem 20rem at 70% 78%, rgba(120,70,220,.10), transparent 70%),
    radial-gradient(26rem 14rem at 10% 88%, rgba(173,92,255,.07), transparent 70%); }
.far{ position:fixed; right:-70px; bottom:-30px; width:420px; height:auto; pointer-events:none; z-index:-1; opacity:.8; }
.hero{ position:relative; isolation:isolate; }
.bh{ position:absolute; left:50%; top:84px; width:900px; max-width:none; height:auto; transform:translate(-50%,-50%); z-index:-1; pointer-events:none; overflow:visible; }
.bh .flow{ animation:orbit 40s linear infinite; }
.bh .flow.f2{ animation-duration:62s; animation-direction:reverse; }
.hero.gulping .bh .flow{ animation-duration:4s; }
@keyframes orbit{ to{ stroke-dashoffset:-600; } }

.portal{ width:132px; height:132px; margin:0 auto 14px; position:relative; }
.portal .ring{ position:absolute; inset:4px; border-radius:50%; border:2px dashed rgba(206,173,255,.55); animation:spin 28s linear infinite; }
.portal img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 0 10px rgba(173,92,255,.35)); }
.portal.gulp img{ animation:gulp .7s ease-out; }
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes gulp{ 0%{ transform:scale(1) rotate(0); } 35%{ transform:scale(1.14) rotate(-25deg); filter:drop-shadow(0 0 22px rgba(173,92,255,.7)); } 100%{ transform:scale(1) rotate(0); } }
h1{ margin:0; font-size:28px; letter-spacing:.02em; }
h1 b{ color:var(--am); }
.tag{ margin:6px 0 0; color:var(--muted); }
/* capture */
.cap{ background:var(--panel); border:1px solid var(--am); border-radius:10px; padding:14px; box-shadow:0 0 0 1px rgba(173,92,255,.08), 0 10px 40px -12px rgba(173,92,255,.30); }
.cap textarea{ width:100%; min-height:110px; resize:vertical; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px; caret-color:var(--am); font-size:16px; line-height:1.5; }
.cap textarea:focus{ border-color:var(--am); outline:none; }
.cats{ display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 0; border:0; padding:0; }
.cats legend{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
.cat{ position:relative; }
.cat input{ position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
.cat span{ display:inline-block; border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:13px; color:var(--muted); }
.cat input:checked + span{ border-color:var(--am); color:var(--ink); background:var(--panel2); font-weight:700; }
.cat input:checked + span::before{ content:'✓ '; color:var(--am2); }
.cat input:focus-visible + span{ outline:2px solid var(--focus); outline-offset:2px; }
.cat:hover span{ color:var(--ink); }
.go{ display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap; }
.btn{ background:transparent; border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer; }
.btn:hover{ border-color:var(--am); color:var(--am2); }
.btn.primary{ background:var(--am); border-color:var(--am); color:var(--on-accent); font-weight:700; padding:10px 18px; }
.btn.primary:hover{ background:var(--am2); color:var(--on-accent); }
.btn:disabled{ opacity:.5; cursor:default; }
.btn.sm{ padding:4px 10px; font-size:12px; border-radius:6px; }
.btn.danger:hover{ border-color:var(--bad); color:var(--bad); }
.quote{ min-height:1.5em; margin:12px 2px 0; color:var(--ok); font-size:13px; }
.quote:not(:empty)::before{ content:'✓ '; }
.quote:empty{ margin:0; min-height:0; }
/* legendary line (1 in 100): ember text with a soft amethyst glow, no badge. One slow flare, none under reduced motion. */
.quote.legendary{ color:#FFB27A; font-weight:700; text-shadow:0 0 10px rgba(173,92,255,.55), 0 0 2px rgba(255,140,80,.5); }
.quote.legendary::before{ content:'✦ '; color:var(--am2); }
.quote.legendary.flare{ animation:flare 1.6s ease-out; }
@keyframes flare{ 0%{ text-shadow:0 0 22px rgba(173,92,255,.95), 0 0 8px rgba(255,140,80,.8); } 100%{ text-shadow:0 0 10px rgba(173,92,255,.55), 0 0 2px rgba(255,140,80,.5); } }
.banner{ border:1px dashed var(--warn); color:var(--warn); border-radius:8px; padding:10px 12px; font-size:12px; margin:0 0 14px; }
.banner::before{ content:'! '; font-weight:700; }
/* list */
.filters{ display:flex; gap:6px; flex-wrap:wrap; margin:28px 0 12px; }
.f{ flex:none; white-space:nowrap; border:1px solid transparent; background:transparent; border-radius:6px; padding:4px 10px; cursor:pointer; font-size:12px; color:var(--muted); }
.f:hover{ color:var(--ink); }
.f[aria-pressed="true"]{ border-color:var(--am); color:var(--am2); }
.f .n{ opacity:.7; margin-left:4px; }
.idea{ background:linear-gradient(180deg, rgba(29,32,46,.86), rgba(22,24,34,.86)); border:1px solid rgba(173,92,255,.32); border-radius:8px; padding:12px 14px; margin:0 0 10px; overflow-wrap:anywhere;
  box-shadow:0 0 0 1px rgba(173,92,255,.04), 0 8px 26px -14px rgba(173,92,255,.45); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); transition:border-color .2s, box-shadow .2s; }
.idea:hover{ border-color:rgba(173,92,255,.6); box-shadow:0 0 0 1px rgba(173,92,255,.08), 0 10px 30px -12px rgba(173,92,255,.6); }
.idea .c{ display:inline-flex; align-items:center; gap:6px; }
.ci{ width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none; }
/* idea text flying into the black hole */
.fly{ position:fixed; left:0; top:0; pointer-events:none; z-index:20; color:var(--ink); font-size:16px; line-height:1.5; white-space:pre; will-change:transform,opacity; }
.idea .h{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-bottom:6px; }
.idea .c{ color:var(--am2); }
.idea .b{ white-space:pre-wrap; }
.idea .acts{ display:flex; gap:6px; margin-left:auto; }
.idea textarea{ width:100%; min-height:90px; resize:vertical; background:var(--bg); border:1px solid var(--am); border-radius:6px; padding:10px; font-size:16px; }
.idea select{ background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
.idea .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
.empty{ color:var(--muted); font-size:13px; padding:8px 2px; }
.empty::before{ content:'// '; }
.err{ color:var(--bad); font-size:12px; }
.err:not(:empty)::before{ content:'× '; }
.toast{ position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--panel); border:1px solid var(--am); border-radius:8px; padding:10px 14px; display:flex; gap:12px; align-items:center; z-index:9; max-width:calc(100% - 32px); box-shadow:0 8px 30px rgba(0,0,0,.6); }
.toast[hidden]{ display:none; }
.center{ max-width:440px; margin:14vh auto; padding:28px; background:var(--panel); border:1px solid var(--am); border-radius:10px; text-align:center; }
.later{ margin-top:30px; font-size:12px; color:var(--muted); text-align:center; }
@media (prefers-reduced-motion:reduce){ .portal .ring, .portal.gulp img, .bh .flow, .quote.legendary.flare{ animation:none; } }
@media (max-width:520px){ .filters{ flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin-left:-16px; margin-right:-16px; padding:0 16px 4px; scroll-padding:0 16px; } .filters::-webkit-scrollbar{ display:none; } h1{ font-size:24px; } .portal{ width:104px; height:104px; } .bh{ width:560px; top:70px; } .far{ width:240px; right:-60px; bottom:-20px; opacity:.55; } .go .btn.primary{ flex:1; } }
</style>

    <circle r="70" fill="url(#bhHalo2)"/><path d="M-30 0 A30 26 0 0 1 30 0" fill="none" stroke="#AD5CFF" stroke-width="1" opacity=".5"/>
    <circle r="22" fill="#06060B"/><circle r="22.5" fill="none" stroke="#E6D4FF" stroke-width="1.6" opacity=".85"/>

    <path d="M-110 0 A110 16 0 0 1 -24 -14" fill="none" stroke="#AD5CFF" stroke-width="1" opacity=".35"/><path d="M24 -14 A110 16 0 0 1 110 0" fill="none" stroke="#AD5CFF" stroke-width="1" opacity=".35"/></g>

<script>
// Same Supabase project and sign-in as the dashboard (same origin, so the session carries over).
const STUDIO = { supabaseUrl: 'https://klbbcwlddgtsolvsxvwe.supabase.co', supabaseKey: 'sb_publishable_k0ZE76Yc9hnXs0-8hwV0sQ_lHFFjzt9' }
const CATS = [['arcade','Arcade'],['checkpoint','Checkpoint'],['off-the-clock','Off the Clock'],['spitz-dev','spitz.dev'],['random','Random Bullshit']]
const CAT = Object.fromEntries(CATS)
const CICON = {
  arcade:'<rect x="3" y="7" width="18" height="11" rx="4"/><path d="M8 10.5v4M6 12.5h4"/><circle cx="15.5" cy="11.5" r=".6"/><circle cx="17.5" cy="13.8" r=".6"/>',
  checkpoint:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  'off-the-clock':'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/>',
  'spitz-dev':'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 10 3 2.5L7 15M12 15h5"/>',
  random:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>'
}
const cico = k => CICON[k] ? `<svg class="ci" viewBox="0 0 24 24" aria-hidden="true">${CICON[k]}</svg>` : ''
// What the Void says after a save lives in voice.js. This one line is the fallback if that file fails to load.
const FALLBACK_QUOTE = 'Your idea has been consumed. Your responsibilities have not increased.'
const PREVIEW_KEY = 'void_preview_ideas'
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))
const when = t => { const d = new Date(t), s = (Date.now() - d) / 1000
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' h ago'
  return d.toLocaleDateString([], { month:'short', day:'numeric', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' }) }
const uuid = () => crypto.randomUUID ? crypto.randomUUID() : 'x' + Date.now() + Math.random().toString(36).slice(2)
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v) } catch (e) { return null } }

const app = document.getElementById('app')
let sb, preview = false, ideas = [], filter = store('void_filter') || 'all', editing = null, lastQuote = null, toastTimer

// ---- storage: Supabase table void_ideas, or a clearly labelled local preview until it exists
const db = {
  async list() {
    if (preview) { try { return JSON.parse(store(PREVIEW_KEY) || '[]') } catch (e) { return [] } }
    const { data, error } = await sb.from('void_ideas').select('id,created_at,updated_at,category,body').order('created_at', { ascending: false }).limit(1000)
    if (error) throw error
    return data
  },
  save() { if (preview) store(PREVIEW_KEY, JSON.stringify(ideas)) },
  async insert(row) {
    if (preview) { ideas.unshift(row); ideas.sort((a, b) => new Date(b.created_at) - new Date(a.created_at)); db.save(); return row }
    const { data, error } = await sb.from('void_ideas').insert(row).select('id,created_at,updated_at,category,body').single()
    if (error) throw error
    return data
  },
  async update(id, patch) {
    if (preview) { const i = ideas.find(x => x.id === id); Object.assign(i, patch, { updated_at: new Date().toISOString() }); db.save(); return i }
    const { data, error } = await sb.from('void_ideas').update(patch).eq('id', id).select('id,created_at,updated_at,category,body').single()
    if (error) throw error
    return data
  },
  async remove(id) {
    if (preview) { ideas = ideas.filter(x => x.id !== id); db.save(); return }
    const { error } = await sb.from('void_ideas').delete().eq('id', id)
    if (error) throw error
  }
}
const missingTable = e => e && (e.code === 'PGRST205' || e.code === '42P01' || /void_ideas/.test(e.message || ''))

if (!window.supabase) app.innerHTML = '<div class="center"><h1>the <b>void</b></h1><p class="err">Could not load sign-in. Check your connection and reload.</p></div>'
else start()

async function start() {
  sb = window.supabase.createClient(STUDIO.supabaseUrl, STUDIO.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, flowType: 'pkce' } })
  const { data: { session } } = await sb.auth.getSession()
  if (!session) {
    app.innerHTML = `<div class="center"><h1>the <b>void</b></h1><p class="tag">Private. Sign in on the spitz.dev dashboard first.</p><p><a class="btn primary" href="../" style="text-decoration:none;display:inline-block">go to spitz.dev</a></p></div>`
    return
  }
  try { ideas = await db.list() }
  catch (e) {
    if (!missingTable(e)) { shell(); setErr("Couldn't open the void: " + e.message); return }
    preview = true; ideas = await db.list()
  }
  shell(); renderList()
}

function shell() {
  app.innerHTML = `
    <section class="hero" id="hero"><svg class="bh" viewBox="-450 -225 900 450" aria-hidden="true" focusable="false">
        <defs>
          <radialGradient id="bhHalo"><stop offset="0" stop-color="#AD5CFF" stop-opacity=".38"/><stop offset=".3" stop-color="#AD5CFF" stop-opacity=".16"/><stop offset=".6" stop-color="#7A3FE0" stop-opacity=".06"/><stop offset="1" stop-color="#AD5CFF" stop-opacity="0"/></radialGradient>
          <linearGradient id="bhDiskL" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#AD5CFF" stop-opacity="0"/><stop offset=".2" stop-color="#E6D4FF" stop-opacity="1"/><stop offset=".45" stop-color="#CEADFF" stop-opacity=".9"/><stop offset=".75" stop-color="#AD5CFF" stop-opacity=".6"/><stop offset="1" stop-color="#AD5CFF" stop-opacity="0"/></linearGradient>
          <filter id="bhGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="bhSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
        </defs>
        <circle r="225" fill="url(#bhHalo)"/>
        <g transform="rotate(-9)">
          <!-- glow under the whole disk -->
          <ellipse rx="300" ry="46" fill="none" stroke="#AD5CFF" stroke-width="22" opacity=".18" filter="url(#bhSoft)"/>
          <!-- back half of the disk, bent up over the shadow by the lensing -->
          <g filter="url(#bhGlow)">
            <path d="M-100 0 A100 84 0 0 1 100 0" fill="none" stroke="url(#bhDiskL)" stroke-width="5" opacity=".85"/>
            <path d="M-116 0 A116 100 0 0 1 116 0" fill="none" stroke="url(#bhDiskL)" stroke-width="2" opacity=".55"/>
            <path d="M-134 0 A134 118 0 0 1 134 0" fill="none" stroke="url(#bhDiskL)" stroke-width="1" opacity=".3"/>
            <path d="M-330 0 A330 50 0 0 1 330 0" fill="none" stroke="url(#bhDiskL)" stroke-width="2" opacity=".6"/>
            <path d="M-260 0 A260 38 0 0 1 260 0" fill="none" stroke="url(#bhDiskL)" stroke-width="1.4" opacity=".5"/>
          </g>
          <path class="flow f2" d="M-295 0 A295 44 0 0 1 295 0" fill="none" stroke="#E6D4FF" stroke-width="1.6" stroke-dasharray="2 12" opacity=".6"/>
        </g>
        <!-- the shadow and its photon ring -->
        <circle r="74" fill="#05050A"/>
        <g filter="url(#bhGlow)"><circle r="75.5" fill="none" stroke="#E6D4FF" stroke-width="2.2" opacity=".9"/></g>
        <circle r="81" fill="none" stroke="#AD5CFF" stroke-width="1.2" opacity=".45"/>
        <circle r="88" fill="none" stroke="#AD5CFF" stroke-width="1" opacity=".2"/>
        <g transform="rotate(-9)">
          <!-- near half of the disk, passing in front of the shadow -->
          <g filter="url(#bhGlow)">
            <path d="M-330 0 A330 50 0 0 0 330 0" fill="none" stroke="url(#bhDiskL)" stroke-width="4" opacity=".9"/>
            <path d="M-220 0 A220 30 0 0 0 220 0" fill="none" stroke="url(#bhDiskL)" stroke-width="2" opacity=".6"/>
            <path d="M-380 0 A380 60 0 0 0 380 0" fill="none" stroke="url(#bhDiskL)" stroke-width="1" opacity=".35"/>
          </g>
          <path class="flow" d="M-280 0 A280 41 0 0 0 280 0" fill="none" stroke="#E6D4FF" stroke-width="1.6" stroke-dasharray="3 14" opacity=".7"/>
          <path class="flow f2" d="M-360 0 A360 56 0 0 0 360 0" fill="none" stroke="#CEADFF" stroke-width="1" stroke-dasharray="1 20" opacity=".5"/>
        </g>
      </svg><div class="portal" id="portal" aria-hidden="true"><div class="ring"></div><img src="portal.png" alt="" width="512" height="512"></div>
      <h1>the <b>void</b></h1><p class="tag">Get it out of your head. Into the void.</p></section>
    ${preview ? `<div class="banner"><b>Local preview.</b> Ideas are saved only in this browser on this device, until the void_ideas database update is applied. Nothing is synced yet.</div>` : ''}
    <form class="cap" id="cap" autocomplete="off">
      <label for="body" class="sub">// what's rattling around in there?</label>
      <textarea id="body" required maxlength="8000" placeholder="An idea, a someday, a what-if..." spellcheck="true"></textarea>
      <fieldset class="cats"><legend>Category</legend>${CATS.map(([k, n], i) => `<label class="cat"><input type="radio" name="cat" value="${k}" ${k === (store('void_cat') || 'random') ? 'checked' : ''}><span>${esc(n)}</span></label>`).join('')}</fieldset>
      <div class="go"><button class="btn primary" type="submit" id="drop">drop it in the void</button><span class="sub">ctrl/⌘ + enter</span></div>
      <p class="quote" id="quote" role="status" aria-live="polite"></p>
    </form>
    <div class="filters" id="filters" role="group" aria-label="Show category"></div>
    <div id="list"></div>
    <p class="err" id="err"></p>
    <p class="sub" id="mode"></p><p class="later">Deposit your thoughts. Reclaim your sanity.<br>// sending an idea to ChatGPT or Claude: coming later. For now, use Copy.</p>`
  document.getElementById('mode').textContent = preview ? 'local preview' : 'private · synced'
  const body = document.getElementById('body'), form = document.getElementById('cap')
  body.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); form.requestSubmit() } })
  form.onsubmit = async e => {
    e.preventDefault()
    const text = body.value.trim(); if (!text) return
    const category = form.cat.value; store('void_cat', category)
    const btn = document.getElementById('drop'); btn.disabled = true; setErr('')
    try {
      const prevAt = ideas.reduce((m, x) => (!m || x.created_at > m ? x.created_at : m), null) // newest idea before this one, for the voice
      const now = new Date().toISOString()
      const row = await db.insert(preview ? { id: uuid(), created_at: now, updated_at: now, category, body: text } : { category, body: text })
      if (!preview) ideas.unshift(row)
      suckIn(body, text); body.value = ''
      sayQuote(prevAt); gulp(); renderList()
    } catch (err) { setErr("Couldn't save it (your text is still in the box): " + err.message) }
    btn.disabled = false; body.focus()
  }
}

// Called only after a successful save. Rarity and context live in voice.js.
function sayQuote(prevAt) {
  const q = document.getElementById('quote'); if (!q) return
  const p = window.VoidVoice ? VoidVoice.pick({ prevAt, now: new Date(), last: lastQuote }) : { text: FALLBACK_QUOTE, tier: 'common' }
  lastQuote = p.text
  q.classList.remove('legendary', 'flare'); q.dataset.tier = p.tier
  if (p.tier === 'legendary') { void q.offsetWidth; q.classList.add('legendary', 'flare') }
  q.textContent = p.text
}
function gulp() { const p = document.getElementById('portal'), h = document.getElementById('hero'); p.classList.remove('gulp'); void p.offsetWidth; p.classList.add('gulp')
  h.classList.add('gulping'); clearTimeout(gulp.t); gulp.t = setTimeout(() => h.classList.remove('gulping'), 1600) }
// The dropped text breaks into words that spiral into the black hole. Reduced motion: skipped.
function suckIn(ta, text) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !document.body.animate) return
  const p = document.getElementById('portal'); if (!p) return
  const tr = ta.getBoundingClientRect(), pr = p.getBoundingClientRect(), cx = pr.left + pr.width / 2, cy = pr.top + pr.height / 2
  const cs = getComputedStyle(ta), padL = parseFloat(cs.paddingLeft), padT = parseFloat(cs.paddingTop)
  // lay the words out roughly where they sat in the box (first 40 words, first 4 lines)
  const meas = document.createElement('span'); meas.className = 'fly'; meas.style.visibility = 'hidden'; document.body.appendChild(meas)
  const words = text.replace(/\s+/g, ' ').split(' ').filter(Boolean).slice(0, 40), lineH = parseFloat(cs.lineHeight) || 24, maxW = tr.width - padL * 2
  let x = 0, line = 0; const items = []
  for (const w of words) {
    meas.textContent = w; const ww = meas.getBoundingClientRect().width
    meas.textContent = ' '; const sp = meas.getBoundingClientRect().width || 9
    if (x && x + ww > maxW) { x = 0; line++ }
    if (line > 3) break
    items.push({ w, x: tr.left + padL + x, y: tr.top + padT + line * lineH, ww }); x += ww + sp
  }
  meas.remove()
  const ph = ta.placeholder; ta.placeholder = ''; setTimeout(() => { ta.placeholder = ph }, 1700) // keep the box clean while the words leave
  items.forEach((it, i) => {
    const el = document.createElement('span'); el.className = 'fly'; el.textContent = it.w; document.body.appendChild(el)
    const sx = it.x + it.ww / 2, sy = it.y + lineH / 2
    const a0 = Math.atan2(sy - cy, sx - cx), r0 = Math.hypot(sx - cx, sy - cy), turn = 1.6 + Math.random() * .6, dir = sx < cx ? -1 : 1
    const frames = []
    // starts exactly where the word sat in the box, trembles for a beat as the pull starts, then spirals in faster and faster
    const N = 14, home = `translate(${it.x}px,${it.y}px)`
    frames.push({ transform: home, opacity: 1, color: '#F2F0F8', offset: 0 })
    frames.push({ transform: `translate(${it.x + Math.cos(a0 + Math.PI) * 2}px,${it.y + 1}px) rotate(${-dir * 2}deg)`, opacity: 1, color: '#F2F0F8', offset: .12 })
    for (let f = 1; f <= N; f++) {
      const k = f / N, e = k * k * k, r = r0 * (1 - e), a = a0 + dir * turn * Math.PI * e, sq = 1 - .45 * Math.min(1, e * 1.6)
      const px = cx + Math.cos(a) * r - it.ww / 2, py = cy + Math.sin(a) * r * sq - lineH / 2
      frames.push({ transform: `translate(${px}px,${py}px) rotate(${dir * e * 260}deg) scale(${1 - e * .92})`, opacity: f === N ? 0 : 1 - e * .3, color: e > .35 ? '#CEADFF' : '#F2F0F8', offset: .12 + .88 * k })
    }
    el.style.transform = home
    el.animate(frames, { duration: 1500 + Math.random() * 300, delay: i * 18, easing: 'linear', fill: 'both' }).onfinish = () => el.remove()
  })
}
function setErr(m) { const e = document.getElementById('err'); if (e) e.textContent = m }

function renderList() {
  const counts = Object.fromEntries(CATS.map(([k]) => [k, ideas.filter(x => x.category === k).length]))
  if (filter !== 'all' && !CAT[filter]) filter = 'all'
  document.getElementById('filters').innerHTML = [['all', 'Everything'], ...CATS].map(([k, n]) =>
    `<button class="f" data-f="${k}" aria-pressed="${filter === k}">${esc(n)}<span class="n">${k === 'all' ? ideas.length : counts[k]}</span></button>`).join('')
  document.querySelectorAll('.f').forEach(b => b.onclick = () => { filter = b.dataset.f; store('void_filter', filter); renderList() })
  const list = ideas.filter(x => filter === 'all' || x.category === filter)
  const el = document.getElementById('list')
  el.innerHTML = list.map(x => editing === x.id ? `
    <article class="idea" data-id="${x.id}"><div class="h"><span>editing</span></div>
      <textarea data-eb aria-label="Idea text" maxlength="8000">${esc(x.body)}</textarea>
      <div class="row"><select data-ec aria-label="Category">${CATS.map(([k, n]) => `<option value="${k}" ${k === x.category ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
        <button class="btn sm" data-a="save">save</button><button class="btn sm" data-a="cancel">cancel</button></div></article>` : `
    <article class="idea" data-id="${x.id}">
      <div class="h"><span class="c">${cico(x.category)}${esc(CAT[x.category] || x.category)}</span><time datetime="${esc(x.created_at)}" title="${esc(new Date(x.created_at).toLocaleString())}">${when(x.created_at)}</time>${x.updated_at && new Date(x.updated_at) - new Date(x.created_at) > 60e3 ? '<span>· edited</span>' : ''}
        <span class="acts"><button class="btn sm" data-a="copy" title="Copy the text">copy</button><button class="btn sm" data-a="edit">edit</button><button class="btn sm danger" data-a="del">delete</button></span></div>
      <div class="b">${esc(x.body)}</div></article>`).join('') ||
    `<p class="empty">${ideas.length ? 'nothing in this corner of the void.' : 'the void is empty. it is patient.'}</p>`
  el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => act(b.dataset.a, b.closest('.idea').dataset.id, b))
  const ed = el.querySelector('[data-eb]'); if (ed) { ed.focus(); ed.setSelectionRange(ed.value.length, ed.value.length) }
}

async function act(a, id, btn) {
  const x = ideas.find(i => i.id === id); if (!x) return
  setErr('')
  if (a === 'edit') { editing = id; renderList(); return }
  if (a === 'cancel') { editing = null; renderList(); return }
  if (a === 'copy') {
    try { await navigator.clipboard.writeText(x.body); btn.textContent = 'copied' } catch (e) { btn.textContent = 'copy failed' }
    setTimeout(() => { btn.textContent = 'copy' }, 1500); return
  }
  if (a === 'save') {
    const card = btn.closest('.idea'), body = card.querySelector('[data-eb]').value.trim(), category = card.querySelector('[data-ec]').value
    if (!body) { setErr('An idea needs some words. To remove it, use delete.'); return }
    btn.disabled = true
    try { const row = await db.update(id, { body, category }); Object.assign(x, row); editing = null; renderList() }
    catch (e) { btn.disabled = false; setErr("Couldn't save the edit: " + e.message) }
    return
  }
  if (a === 'del') {
    btn.disabled = true
    try {
      await db.remove(id)
      if (!preview) ideas = ideas.filter(i => i.id !== id)
      renderList(); undoToast(x)
    } catch (e) { btn.disabled = false; setErr("Couldn't delete it: " + e.message) }
  }
}

// delete is instant, with 8 seconds to undo (the same idea comes back with its original id and time)
function undoToast(x) {
  const t = document.getElementById('toast')
  t.innerHTML = `<span>Idea deleted.</span><button class="btn sm" id="undo">undo</button>`
  t.hidden = false; clearTimeout(toastTimer)
  document.getElementById('undo').onclick = async () => {
    clearTimeout(toastTimer); t.hidden = true
    try {
      const row = await db.insert({ id: x.id, created_at: x.created_at, updated_at: x.updated_at, category: x.category, body: x.body })
      if (!preview) { ideas.push(row); ideas.sort((a, b) => new Date(b.created_at) - new Date(a.created_at)) }
      renderList()
    } catch (e) { setErr("Couldn't undo: " + e.message + '. The text was: ' + x.body) }
  }
  toastTimer = setTimeout(() => { t.hidden = true }, 8000)
}
</script>
<script>
// Starfield (decoration): steady stars everywhere, plus a slow trickle of dust spiralling into the black hole behind the portal.
// Stars never blink. Reduced motion: drawn once, nothing moves.
;(() => {
  const c = document.getElementById('sky'), x = c.getContext('2d'), still = matchMedia('(prefers-reduced-motion: reduce)').matches
  let W, H, dpr, stars = [], dust = []
  const rnd = (a, b) => a + Math.random() * (b - a)
  function size() {
    dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight
    c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0)
    const n = Math.round(W * H / 6000)
    stars = Array.from({ length: n }, () => ({ x: rnd(0, W), y: rnd(0, H), r: Math.random() < .1 ? rnd(1, 1.6) : rnd(.4, .9), a: rnd(.25, .8), v: Math.random() < .5 }))
    if (still) draw(0)
  }
  function hole() { const p = document.getElementById('portal'); if (!p) return null; const r = p.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 } }
  function spawn(h) { const ang = rnd(0, Math.PI * 2), d = rnd(240, Math.max(W, H) * .7); return { ang, d, h, sp: rnd(.05, .12), a: 0, r: rnd(.6, 1.4), v: Math.random() < .6 } }
  let last = 0
  function draw(t) {
    const dt = Math.min(.05, (t - last) / 1000 || 0); last = t
    x.clearRect(0, 0, W, H)
    for (const s of stars) { x.globalAlpha = s.a; x.fillStyle = s.v ? '#CEADFF' : '#F2F0F8'; x.fillRect(s.x, s.y, s.r, s.r) }
    const h = hole()
    if (h && !still) {
      const fast = document.getElementById('hero')?.classList.contains('gulping') ? 4 : 1
      while (dust.length < 70) dust.push(spawn(h))
      for (const p of dust) {
        // closer = faster, like an orbit; the path is squashed to match the tilted disk
        const k = 1 + 160 / p.d
        p.ang += p.sp * k * k * dt * fast; p.d -= 7 * k * k * dt * fast; p.a = Math.min(1, p.a + dt * .4)
        const px = h.x + Math.cos(p.ang) * p.d, py = h.y + Math.sin(p.ang) * p.d * .32
        const fade = p.d < 140 ? Math.max(0, (p.d - 76) / 64) : 1
        x.globalAlpha = p.a * fade * .9; x.fillStyle = p.v ? '#CEADFF' : '#E6D4FF'; x.fillRect(px, py, p.r, p.r)
      }
      dust = dust.filter(p => p.d > 78)
    }
    x.globalAlpha = 1
    if (!still) requestAnimationFrame(draw)
  }
  addEventListener('resize', size); size(); if (!still) requestAnimationFrame(draw)
})()
</script>
