<style>
/* spitz.dev: Kody's board for the tasks ChatGPT and Claude share (Task Drop). Private: sign-in required, noindex.
   Look: terminal. Black and charcoal, burger-orange outlines, one mono font. */
:root{
  /* Colors follow design/tokens.css (spitz.dev color system). Neutral first, identity second, status third. */
  --bg:#0B0C14; --panel:#161822; --panel2:#1D202E; --line:#35394A; --ink:#F2F0F8; --muted:#979BAC;
  --orange:#FF892E; --orange2:#FFAD74;
  /* identity: borders/marks use the -line shade; small text uses the -text shade */
  --spitz:#FF892E; --chatgpt:#19CFF5; --claude:#EF3B36; --done:#A5A8B5;
  --spitz-text:#FFAC6F; --chatgpt-text:#9BEAFF; --claude-text:#FF4F4F; --done-text:#A5A8B5;
  --void:#AD5CFF; --void-text:#CEADFF;
  /* status: always paired with a word, and an icon where it is shown alone */
  --good:#8ED8B1; --warn:#E9BD70; --bad:#FF8293;
  /* interaction */
  --link:#D4DCF4; --hover:#FFAD74; --focus:#FFE2AA;
}
*{ box-sizing:border-box; }
html,body{ margin:0; overflow-x:hidden; max-width:100%; background:var(--bg); color:var(--ink); font:14px/1.55 'JetBrains Mono',ui-monospace,monospace; }
button,input,textarea,select{ font:inherit; color:inherit; }
a{ color:var(--link); }
a:hover{ color:var(--hover); }
::selection{ background:var(--orange); color:#000; }
header{ display:flex; align-items:center; gap:14px; padding:12px 20px; border-bottom:1px solid var(--orange); position:sticky; top:0; background:var(--bg); z-index:5; flex-wrap:wrap; }
.mark{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px; }
.mark img{ height:30px; width:auto; display:block; }
.mark b{ color:var(--orange); font-weight:700; }
.cursor{ display:inline-block; width:.6em; height:1.05em; background:var(--orange); vertical-align:-2px; margin-left:2px; animation:blink 1.1s steps(1) infinite; }
@keyframes blink{ 50%{ opacity:0; } }
@media (prefers-reduced-motion:reduce){ .cursor{ animation:none; } }
.sub{ color:var(--muted); font-size:12px; }
.grow{ flex:1; }
.btn{ background:transparent; border:1px solid var(--line); border-radius:6px; padding:7px 12px; cursor:pointer; }
.btn:hover{ border-color:var(--orange); color:var(--orange2); }
.btn.primary{ border-color:var(--orange); color:var(--orange); font-weight:700; }
.btn.primary:hover{ background:var(--orange); color:#000; }
.btn.gpt{ border-color:var(--chatgpt); color:var(--chatgpt-text); }
.btn.cl{ border-color:var(--claude); color:var(--claude-text); }
.btn.dn{ color:var(--muted); }
.btn:disabled{ opacity:.5; cursor:default; }
.chips{ display:flex; gap:4px; flex-wrap:wrap; }
.chip{ padding:4px 10px; border-radius:6px; border:1px solid transparent; background:transparent; cursor:pointer; font-size:12px; color:var(--muted); }
.chip:hover{ color:var(--ink); }
.chip.on{ border-color:var(--orange); color:var(--orange); }
main{ padding:18px 20px 40px; }
.board{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
.col, .card{ min-width:0; overflow-wrap:anywhere; }
@media (max-width:1000px){ .board{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:620px){ .board{ grid-template-columns:minmax(0,1fr); } header{ padding:10px 16px; } main{ padding:14px 16px 40px; } }
.col{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; min-height:120px; }
.col.who-spitz, .col.who-chatgpt, .col.who-claude{ border:2px solid var(--c); }
.col h2{ margin:0 0 10px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px; color:var(--c); }
.col h2::before{ content:'>'; color:var(--muted); }
.dot{ display:none; }
.count{ color:var(--muted); font-weight:400; }
.card{ display:block; width:100%; text-align:left; background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin-bottom:8px; cursor:pointer; }
.card:hover{ border-color:var(--c,var(--orange)); }
.card .t{ font-weight:600; }
.card .m{ color:var(--muted); font-size:12px; margin-top:4px; display:flex; gap:10px; flex-wrap:wrap; }
.empty{ color:var(--muted); font-size:13px; padding:6px 2px; }
/* desktop board fills the screen; each column scrolls on its own, heading stays put */
@media (min-width:1001px){
  main:has(> .board){ height:100vh; display:flex; flex-direction:column; padding-bottom:12px; }
  main:has(> .board) .board{ flex:1; min-height:0; }
  main:has(> .board) .col{ display:flex; flex-direction:column; min-height:0; padding:0; }
  main:has(> .board) .col h2{ padding:12px 12px 0; }
  main:has(> .board) .cb{ flex:1; min-height:0; overflow-y:auto; padding:0 12px 4px; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  main:has(> .board) #status{ margin:10px 0 0; }
}
.empty::before{ content:'// '; }
/* empty column: a dim icon in the column's color */
.empty2{ display:flex; flex-direction:column; align-items:center; gap:10px; padding:32px 8px; color:var(--muted); font-size:12px; text-align:center; }
.empty2 svg{ width:40px; height:40px; fill:none; stroke:var(--c,var(--muted)); stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; opacity:.5; }
/* art thumbnail on a board card */
.card .thumb{ float:right; width:56px; height:56px; object-fit:contain; image-rendering:pixelated; margin:0 0 6px 10px; border-radius:4px; border:1px solid var(--line);
  background:repeating-conic-gradient(#272A3B 0 25%,#1D202E 0 50%) 0 0/10px 10px; }
.card::after{ content:''; display:block; clear:both; }
.who-spitz{ --c:var(--spitz); --ct:var(--spitz-text); } .who-chatgpt{ --c:var(--chatgpt); --ct:var(--chatgpt-text); } .who-claude{ --c:var(--claude); --ct:var(--claude-text); } .who-done{ --c:var(--done); --ct:var(--done-text); }
/* layout + side bar (like Checkpoint's) */
body.signed{ display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh; }
body.signed.mini{ grid-template-columns:64px minmax(0,1fr); }
.side, main{ min-width:0; }
#app{ display:contents; }
.side{ position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:10px; padding:14px 12px; background:var(--panel); border-right:1px solid var(--orange); overflow:auto; }
.side svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.brand{ display:flex; align-items:center; gap:10px; padding:2px 2px 6px; font-weight:700; font-size:16px; }
.brand img{ height:26px; width:auto; }
.brand b{ color:var(--orange); }
.ib{ background:transparent; border:1px solid transparent; border-radius:6px; padding:6px; cursor:pointer; color:var(--muted); display:grid; place-items:center; }
.ib:hover{ color:var(--orange); border-color:var(--line); }
.ib.lit{ color:var(--orange); }
.collapse{ margin-left:auto; }
.mini .collapse svg{ transform:rotate(180deg); }
.search{ display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:6px; padding:0 10px; background:var(--bg); color:var(--muted); cursor:text; }
.search:focus-within{ border-color:var(--orange); }
.search input{ flex:1; min-width:0; border:0; background:transparent; outline:none; padding:8px 0; caret-color:var(--orange); }
.proj{ background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px; }
.proj:focus{ border-color:var(--orange); outline:none; }
.nb{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:transparent; border:1px solid transparent; border-radius:6px; padding:8px 10px; cursor:pointer; color:var(--ink); }
.nb:hover{ border-color:var(--line); color:var(--orange2); }
.nb.on{ background:var(--orange); color:#000; font-weight:700; }
.nb .n{ margin-left:auto; font-size:12px; color:var(--ct,var(--muted)); }
.nb.on .n{ color:#000; }
.newb{ border-color:var(--orange); color:var(--orange); font-weight:700; }
a.nb.void{ text-decoration:none; color:var(--void-text); } a.nb.void:hover{ border-color:var(--void); color:var(--void-text); }
nav{ display:flex; flex-direction:column; gap:2px; border-top:1px solid var(--line); padding-top:10px; }
.foot{ display:flex; align-items:center; gap:4px; border-top:1px solid var(--line); padding-top:10px; }
.live{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-right:auto; padding-left:4px; }
.live i{ width:8px; height:8px; border-radius:50%; background:var(--good); }
.live.off i{ background:var(--bad); }
.side .who{ font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mini .side{ padding:14px 8px; align-items:center; }
.mini .side .lbl, .mini .side .proj, .mini .side .n{ display:none; }
.mini .search{ padding:8px; border-color:transparent; }
.mini .search input{ display:none; }
.mini .nb{ justify-content:center; padding:9px; }
.mini .brand{ flex-direction:column; }
.mini .collapse{ margin:0; }
.mini .foot{ flex-direction:column; }
.mini .live{ margin:0 0 4px; padding:0; }
.list .lh{ margin:0 0 12px; font-size:14px; color:var(--c); }
.list .lh::before{ content:'> '; color:var(--muted); }
.list .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; }
@media (max-width:760px){
  body.signed, body.signed.mini{ grid-template-columns:minmax(0,1fr); }
  input, select, textarea{ font-size:16px; }
  .side, .mini .side{ position:sticky; height:auto; flex-direction:row; flex-wrap:wrap; align-items:center; border-right:0; border-bottom:1px solid var(--orange); padding:10px 16px; gap:8px; z-index:5; }
  .side .grow, .side .who, .collapse{ display:none; }
  .brand{ padding:0; }
  .search{ flex:1; min-width:140px; }
  .mini .search input{ display:block; } .mini .side .lbl{ display:inline; } .mini .side .proj{ display:block; }
  .proj{ flex:1; }
  .newb{ width:auto; }
  nav{ flex-direction:row; flex-wrap:wrap; width:100%; border-top:0; padding-top:0; }
  nav .nb{ width:auto; padding:6px 8px; } nav .nb .lbl{ display:none; } nav .nb.on .lbl{ display:inline; }
  .foot{ border-top:0; padding-top:0; } .foot .live{ display:none; }
}
/* Now view: focused, for 1 or 2 active tasks */
.nowv .lh{ margin:0 0 12px; font-size:14px; color:var(--orange); }
.nowv .lh::before{ content:'> '; color:var(--muted); }
.nowv .lh.dn2{ margin-top:26px; color:var(--muted); }
.nowgrid{ display:grid; gap:16px; }
@media (min-width:1300px){ .nowgrid.n2{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
.now{ background:var(--panel); border:1px solid var(--line); border-top:2px solid var(--c); border-radius:6px; padding:14px 16px; min-width:0; overflow-wrap:anywhere; }
.now.who-spitz, .now.who-chatgpt, .now.who-claude{ border:2px solid var(--c); border-top-width:3px; }
.nh{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.pill{ border:1px solid var(--c); color:var(--ct,var(--c)); border-radius:999px; padding:1px 10px; font-size:12px; font-weight:700; }
.nt{ margin:8px 0 6px; font-size:17px; line-height:1.35; }
.state{ font-size:13px; color:var(--ink); }
.state b{ color:var(--ct,var(--c)); }
.state.work b::after{ content:' ●'; color:var(--c); }
.state.warn b{ color:var(--warn); } .state.warn b::before{ content:'! '; }
.state.bad b{ color:var(--bad); } .state.bad b::before{ content:'× '; }
.next{ margin-top:4px; font-size:13px; color:var(--muted); }
.next.hot{ color:var(--orange2); }
.nb2{ display:grid; grid-template-columns:minmax(0,300px) minmax(0,1fr); gap:16px; margin-top:14px; }
.nb2.noimg{ grid-template-columns:minmax(0,1fr); }
.art{ display:block; background:repeating-conic-gradient(#1D202E 0 25%,#161822 0 50%) 0 0/16px 16px; border:1px solid var(--line); border-radius:6px; padding:8px; text-decoration:none; align-self:start; }
.art:hover{ border-color:var(--orange); }
.art img{ display:block; width:100%; height:auto; max-height:300px; object-fit:contain; image-rendering:pixelated; }
.art .cap{ display:block; font-size:11px; color:var(--muted); margin-top:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.feed .msg{ margin:0 0 12px; }
.clip{ display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; font-size:13px; }
.lnk{ background:none; border:0; padding:0; color:var(--link); cursor:pointer; font-size:13px; }
.lnk:hover{ text-decoration:underline; }
.acts{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
.idle{ background:var(--panel); border:1px dashed var(--line); border-radius:6px; padding:22px; color:var(--muted); }
.idle p{ margin:0 0 12px; }
.recent{ display:flex; flex-direction:column; gap:6px; }
.row1{ display:flex; justify-content:space-between; gap:12px; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:9px 12px; cursor:pointer; }
.row1:hover{ border-color:var(--done); }
.row1 .t{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row1 .sub{ white-space:nowrap; }
.recent .lnk{ align-self:flex-start; margin-top:4px; }
.health{ margin:22px 0 0; font-size:12px; color:var(--muted); }
.health.bad, .health b{ color:var(--warn); }
.health.bad::before{ content:'! '; }
/* one task: use the whole width, with a big picture beside the messages */
@media (min-width:761px){ .nowgrid.n1 .nb2{ grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); } .nowgrid.n1 .art img{ max-height:min(560px,60vh); } .nowgrid.n1 .clip{ -webkit-line-clamp:7; } .nowgrid.n2 .nb2{ grid-template-columns:minmax(0,2fr) minmax(0,3fr); } .nowgrid.n2 .art img{ max-height:360px; } .nowgrid .nb2.noimg{ grid-template-columns:minmax(0,1fr); } }
@media (max-width:760px){ .nb2{ grid-template-columns:minmax(0,1fr); } .art img{ max-height:260px; } .row1{ flex-direction:column; gap:2px; } .row1 .t{ white-space:normal; } }
/* drawer */
.shade{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:10; display:none; }
.drawer{ position:fixed; top:0; right:0; bottom:0; width:min(760px,100%); background:var(--bg); border-left:1px solid var(--orange); z-index:11; display:none; flex-direction:column; }

.dbody{ flex:1; overflow:auto; padding:16px 20px; }
.brief{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 14px; margin-bottom:16px; }
.brief summary{ cursor:pointer; color:var(--muted); }
.pre{ white-space:pre-wrap; word-wrap:break-word; }

.msg .h{ font-size:11px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:2px; }
.who{ color:var(--ct,var(--c)); font-weight:700; font-size:12px; }

.dhead .sub, .state{ overflow-wrap:anywhere; }

.tag::before{ content:'['; } .tag::after{ content:']'; }

.thumb{ background:repeating-conic-gradient(#1D202E 0 25%,#161822 0 50%) 0 0/16px 16px; border:1px solid var(--line); border-radius:6px; padding:6px; max-width:100%; text-decoration:none; }

.row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; align-items:center; }

<div id="app"></div>
<script>
const STUDIO = {
  supabaseUrl: 'https://klbbcwlddgtsolvsxvwe.supabase.co',
  // Publishable key: safe in a public page. Row-level security means it only ever shows the signed-in owner's rows.
  supabaseKey: 'sb_publishable_k0ZE76Yc9hnXs0-8hwV0sQ_lHFFjzt9',
  bucket: 'studio-assets'
}
// Five identities (database migration 20261118000000_worker_identities). The page works with the database
// before and after that migration: rows are read into the new names, and writes go out in whatever scheme
// the database speaks (IDV). chatgpt_chat and claude_thread only exist after the migration.
const WHO = { spitz:'You', chatgpt_chat:'your ChatGPT chat', openai_worker:'ChatGPT worker', claude:'Claude worker', claude_thread:'Claude thread' }
const GROUP = { spitz:'spitz', chatgpt_chat:'chatgpt', openai_worker:'chatgpt', claude:'claude', claude_thread:'claude' } // board column + colour
let IDV = 1
const nid = v => v == null ? v : ({ kody:'spitz', chatgpt:'openai_worker' }[v] || v) // old 'chatgpt' turn did start the API worker
const oid = v => v == null || IDV >= 2 ? v : ({ spitz:'kody', openai_worker:'chatgpt' }[v] || v)
const norm = r => { if (r) for (const k of ['turn', 'created_by', 'author', 'set_turn', 'actor']) if (k in r) r[k] = nid(r[k]); return r }
const grp = v => GROUP[v] || 'claude'
async function detectScheme() { const r = await sb.rpc('studio_schema'); IDV = !r.error && r.data && r.data.identities >= 2 ? 2 : 1 }
const app = document.getElementById('app')
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))
const linkify = s => esc(s).replace(/https:\/\/[^\s<]+[^\s<.,;:!?)'"]/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`)
const ago = t => { const s = (Date.now() - new Date(t)) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s/60) + ' min ago'; if (s < 86400) return Math.floor(s/3600) + ' h ago'; return new Date(t).toLocaleDateString() }
const key = () => 'kody-' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2))
const pref = (k, v) => { try { if (v === undefined) return localStorage.getItem('studio_' + k); localStorage.setItem('studio_' + k, v) } catch (e) { return null } }

async function start() {
  sb = window.supabase.createClient(STUDIO.supabaseUrl, STUDIO.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce' } })
  const { data: { session } } = await sb.auth.getSession()
  if (!session) return signIn()
  await detectScheme(); shell(); await load()
  setInterval(() => { if (!document.hidden && !busy) load() }, 20000)
  // while ChatGPT is mid-step, refresh the open view every 5 seconds so progress shows as it happens
  setInterval(() => { if (document.hidden || busy || !(nowLive || drawerLive)) return; if (openId) renderTask(openId, true); if (view === 'now') renderBoard() }, 5000)
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !busy) load() })
}

function signIn() {
  app.innerHTML = `<div class="login"><img src="burger_line_512.png" alt="">
    <h1>spitz<b>.dev</b><span class="cursor" aria-hidden="true"></span></h1>
    <form id="f" class="term"><label for="em" class="prompt">&gt; email</label>
      <input id="em" type="email" required autocomplete="username" spellcheck="false" placeholder="you@example.com">
      <button class="btn primary" type="submit">send sign-in link</button></form>
    <form id="pf" class="term"><label for="pw" class="prompt">&gt; password</label>
      <input id="pw" type="password" autocomplete="current-password" required placeholder="for the phone app">
      <button class="btn primary" type="submit">sign in</button></form>
    <p class="sub" id="say">// private. a sign-in link goes to the owner's email.</p></div>`
  document.getElementById('em').focus()
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault(); const say = document.getElementById('say')
    say.textContent = '// sending...'
    const { error } = await sb.auth.signInWithOtp({ email: document.getElementById('em').value.trim(), options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: false } })
    say.textContent = error ? '// ' + error.message : '// check your email and open the link.'
    say.className = error ? 'err' : 'sub'
  }
  // a password works inside the home-screen app, where email links open in Safari instead
  document.getElementById('pf').onsubmit = async e => {
    e.preventDefault(); const say = document.getElementById('say')
    const em = document.getElementById('em').value.trim()
    if (!em) { say.textContent = '// type your email first.'; say.className = 'err'; return }
    const { error } = await sb.auth.signInWithPassword({ email: em, password: document.getElementById('pw').value })
    if (error) { say.textContent = '// ' + error.message; say.className = 'err'; return }
    location.reload()
  }
}

// phone notifications (Web Push). On iPhone this works once the dashboard is on the home screen.
const swReady = 'serviceWorker' in navigator ? navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).catch(() => null) : Promise.resolve(null)
const b64u = s => { const p = (s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/'); return Uint8Array.from(atob(p), c => c.charCodeAt(0)) }
async function setupBell(btn) {
  const iosTab = /iPhone|iPad|iPod/.test(navigator.userAgent) && !navigator.standalone && !matchMedia('(display-mode: standalone)').matches
  const reg = await swReady
  const can = reg && 'PushManager' in window && 'Notification' in window
  const on = can && Notification.permission === 'granted' && !!(await reg.pushManager.getSubscription())
  btn.classList.toggle('lit', on)
  btn.title = on ? 'Phone notifications are on' : 'Turn on phone notifications'
  if (on) { const s = await reg.pushManager.getSubscription(); sb.rpc('studio_save_push', { p_sub: s.toJSON() }) }
  btn.onclick = async () => {
    const say = document.getElementById('status')
    if (iosTab) { say.textContent = 'To get notifications on iPhone: set a password with the key button first, then tap Share, "Add to Home Screen", open spitz.dev from the home screen, sign in with your password, and tap the bell there.'; return }
    if (!can) { say.textContent = 'This browser cannot show notifications.'; return }
    if (await Notification.requestPermission() !== 'granted') { say.textContent = 'Notifications are blocked. Allow them in your phone settings for spitz.dev, then tap the bell again.'; return }
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u((await sb.rpc('studio_vapid_public')).data || '') })
    const { error } = await sb.rpc('studio_save_push', { p_sub: sub.toJSON() })
    say.textContent = error ? 'Could not turn on notifications: ' + error.message : 'Phone notifications are on. You will get one every time a task changes hands or finishes.'
    btn.classList.toggle('lit', !error)
  }
}

async function load() {
  const { data, error } = await sb.from('studio_tasks').select('*').order('updated_at', { ascending: false }).limit(200)
  const st = document.getElementById('status')
  if (error) { document.getElementById('live').classList.add('off'); st.innerHTML = `<span class="err">Couldn't load tasks: ${esc(error.message)}</span>`; return }
  document.getElementById('live').classList.remove('off'); tasks = data.map(norm); if (!document.getElementById('sp')) st.textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }) + '. Refreshes every 20 seconds.'
  renderBoard()
  if (openId) renderTask(openId, true)
}

function renderBoard() {
  const projects = [...new Set(tasks.map(t => t.project))].sort()
  if (project !== 'all' && !projects.includes(project)) project = 'all'
  const ps = document.getElementById('proj')
  ps.innerHTML = ['all', ...projects].map(p => `<option value="${esc(p)}" ${p === project ? 'selected' : ''}>${p === 'all' ? 'All projects' : esc(p)}</option>`).join('')
  const vis = tasks.filter(t => (project === 'all' || t.project === project) && (!query || (t.title + ' ' + t.brief + ' ' + t.project).toLowerCase().includes(query)))
  const F = {
    spitz: t => t.status !== 'done' && t.turn === 'spitz',
    chatgpt: t => t.status !== 'done' && grp(t.turn) === 'chatgpt' && !!t.turn,
    claude: t => t.status !== 'done' && (grp(t.turn) === 'claude' || !t.turn),
    done: t => t.status === 'done'
  }
  document.getElementById('views').innerHTML = VIEWS.map(([k, name]) => {
    const n = k === 'board' || k === 'now' ? vis.filter(t => t.status !== 'done').length : vis.filter(F[k]).length
    return `<button class="nb who-${k} ${view === k ? 'on' : ''}" data-v="${k}" title="${name}">${ico(k)}<span class="lbl">${name}</span><span class="n">${n || ''}</span></button>`
  }).join('')
  document.querySelectorAll('#views .nb').forEach(b => b.onclick = () => { view = b.dataset.v; pref('view2', view); renderBoard() })
  const card = (t, k) => `<button class="card who-${k}" data-id="${t.id}">${thumbHtml(t)}<div class="t">${esc(t.title)}</div>
        <div class="m"><span>${esc(t.project)}</span><span>${ago(t.updated_at)}</span>${t.status === 'blocked' ? '<span class="blk">blocked</span>' : ''}${t.turn && t.status !== 'done' && k !== 'spitz' ? `<span>${esc(WHO[t.turn] || t.turn)}</span>` : ''}<span>by ${esc(WHO[t.created_by] || t.created_by)}</span></div></button>`
  const keyOf = t => F.done(t) ? 'done' : F.spitz(t) ? 'spitz' : F.chatgpt(t) ? 'chatgpt' : 'claude'
  const b = document.getElementById('board')
  if (view === 'now') { renderNow(vis); return }
  const before = flipStart(b)
  if (view === 'board') {
    b.className = 'board'
    b.innerHTML = ['spitz','chatgpt','claude','done'].map(k => {
      const list = vis.filter(F[k]).slice(0, k === 'done' ? 20 : 100), name = VIEWS.find(v => v[0] === k)[1]
      return `<section class="col who-${k}" data-k="${k}"><h2>${name} <span class="count">${list.length}</span></h2><div class="cb">${list.map(t => card(t, k)).join('') || emptyCol(k)}</div></section>`
    }).join('')
  } else {
    const list = vis.filter(F[view]), name = VIEWS.find(v => v[0] === view)[1]
    b.className = 'list who-' + view
    b.innerHTML = `<h2 class="lh">${name} <span class="count">${list.length}</span></h2><div class="grid">${list.map(t => card(t, keyOf(t))).join('') || emptyCol(view)}</div>`
  }
  flipEnd(b, before)
  boardThumbs(view === 'board' ? vis.filter(t => !F.done(t) || vis.filter(F.done).indexOf(t) < 20) : vis.filter(F[view]))
  document.querySelectorAll('.card').forEach(c => c.onclick = () => renderTask(c.dataset.id))
}

// ---- Board polish: empty columns, art thumbnails, cards slide when they change turn
const EMPTY = { spitz:'nothing on your plate', chatgpt:'ChatGPT has nothing queued', claude:'Claude has nothing queued', done:'nothing finished yet' }
const emptyCol = k => `<div class="empty2">${ico(k)}<span>${EMPTY[k] || 'nothing here'}</span></div>`
const thumbCache = {} // task id -> { v: updated_at, asset }
function thumbHtml(t) {
  const c = thumbCache[t.id], a = c && c.asset, u = a && urlCache[a.id] && urlCache[a.id].exp > Date.now() && urlCache[a.id].url
  return u ? `<img class="thumb" src="${u}" alt="" loading="lazy">` : ''
}
async function boardThumbs(list) {
  try {
    const need = list.filter(t => !thumbCache[t.id] || thumbCache[t.id].v !== t.updated_at)
    if (need.length) {
      const { data, error } = await sb.from('studio_assets').select('id,task_id,file_name,width,height,path,created_at').in('task_id', need.map(t => t.id)).order('created_at', { ascending: false }).limit(300)
      if (error) return
      need.forEach(t => { thumbCache[t.id] = { v: t.updated_at, asset: (data || []).find(a => a.task_id === t.id) || null } })
    }
    const assets = list.map(t => thumbCache[t.id] && thumbCache[t.id].asset).filter(Boolean)
    if (!assets.length) return
    const url = await signedUrls(assets)
    for (const a of assets) {
      const c = document.querySelector(`.card[data-id="${a.task_id}"]`)
      if (c && !c.querySelector('.thumb') && url(a.id)) c.insertAdjacentHTML('afterbegin', `<img class="thumb" src="${url(a.id)}" alt="" loading="lazy">`)
    }
  } catch (e) { /* thumbnails are a nice-to-have */ }
}
const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches
function flipStart(b) {
  const m = {}
  b.querySelectorAll('.card[data-id]').forEach(c => { const col = c.closest('[data-k]'); m[c.dataset.id] = { r: c.getBoundingClientRect(), k: col ? col.dataset.k : '' } })
  return m
}
function flipEnd(b, before) {
  if (calm() || !Object.keys(before).length || !b.animate) return
  b.querySelectorAll('.card[data-id]').forEach(c => {
    const was = before[c.dataset.id], r = c.getBoundingClientRect()
    if (!was) { c.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 350, easing: 'ease-out' }); return }
    const dx = was.r.left - r.left, dy = was.r.top - r.top
    if (Math.abs(dx) < 2 && Math.abs(dy) < 2) return
    const col = c.closest('[data-k]'), moved = col && col.dataset.k !== was.k
    c.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }], { duration: moved ? 650 : 300, easing: 'cubic-bezier(.2,.8,.2,1)' })
    if (moved) c.animate([{ borderColor: 'var(--c)' }, { borderColor: 'var(--c)', offset: .7 }, { borderColor: 'var(--line)' }], { duration: 1600 })
  })
}

// ---- Now view: built for 1 or 2 active tasks. One big card each, real worker state, recent finishes below.
const urlCache = {}
async function signedUrls(assets) {
  const need = assets.filter(a => !urlCache[a.id] || urlCache[a.id].exp < Date.now())
  if (need.length) {
    const { data } = await sb.storage.from(STUDIO.bucket).createSignedUrls(need.map(a => a.path), 3600)
    ;(data || []).forEach((s, i) => { if (s.signedUrl) urlCache[need[i].id] = { url: s.signedUrl, exp: Date.now() + 50 * 60e3 } })
  }
  return id => urlCache[id] && urlCache[id].url
}
const clock = t => new Date(t).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' })
const clockS = t => new Date(t).toLocaleTimeString([], { hour:'numeric', minute:'2-digit', second:'2-digit' })
const secs = t => (Date.now() - new Date(t)) / 1000
const dur = s => s < 60 ? 'under a minute' : s < 3600 ? Math.floor(s / 60) + ' min' : Math.floor(s / 3600) + ' h ' + Math.floor(s % 3600 / 60) + ' min'
const STALE_S = 45 // no heartbeat for this long while "working" = may be stalled (the worker beats every 10 s)
let nowLive = false, drawerLive = false
// ChatGPT worker run -> plain state. Shared by the Now card and the task drawer.
function runState(t, run, gw) {
  if (!run && !gw) return null
  const cap = s => s ? s[0].toUpperCase() + s.slice(1) : ''
  if (run && run.status === 'started') {
    const hb = run.heartbeat || run.at, pics = run.pictures ? ` · ${run.saved || 0} of ${run.pictures} picture${run.pictures > 1 ? 's' : ''} saved` : ''
    if (secs(hb) > STALE_S) return { cls: 'warn', hold: true, label: 'No recent update—may be stalled', detail: `last confirmed ${clockS(hb)} while ${run.step || 'starting'}${pics}`, next: 'The watchdog checks every minute. If the run stopped, it is marked stopped here with a Retry button, and you get one phone alert.' }
    return { cls: 'work', live: true, label: 'ChatGPT: ' + (run.step || 'starting'), detail: `run started ${clock(run.at)}, ${dur(secs(run.at))} so far · last update ${clockS(hb)}${pics}`, next: 'Nothing to do. You get a notification when it hands off.' }
  }
  if (run && (run.status === 'stalled' || run.status === 'error') && t.turn === 'openai_worker' && t.status === 'open')
    return { cls: 'bad', label: run.status === 'stalled' ? 'ChatGPT stopped' : 'ChatGPT hit a problem', detail: (run.detail || '').slice(0, 300), next: 'Press Retry to carry on. Pictures already saved are kept and not redrawn.', retry: run.id }
  if (run && run.status === 'error' && run.version === t.version) return { cls: 'bad', label: 'ChatGPT hit a problem', detail: (run.detail || '').slice(0, 300), next: 'Fix the cause, then hand it back to ChatGPT.' }
  if (t.turn === 'openai_worker' && gw && secs(gw.at) < 3600 && !(run && new Date(run.at) > new Date(gw.at))) {
    if (gw.waiting) return { cls: 'work', live: true, label: 'Waking ChatGPT', detail: `request sent ${clockS(gw.at)}, waiting for an answer` }
    if (gw.code >= 200 && gw.code < 300) return secs(gw.at) > 60
      ? { cls: 'warn', label: 'Wake accepted, but ChatGPT never started', detail: `accepted ${clockS(gw.at)}, nothing since`, next: 'Run ChatGPT now. If it happens again, the worker itself is failing.', run: true }
      : { cls: 'work', live: true, label: 'Wake accepted, starting', detail: `accepted ${clockS(gw.at)}` }
    return { cls: 'bad', label: 'Wake failed', detail: gw.error || `HTTP ${gw.code}`, next: 'Run ChatGPT now to try again.', run: true }
  }
  return null
}
const mins = t => (Date.now() - new Date(t)) / 60e3
const prOf = list => { for (const r of list) if (r.type === 'pr' || (r.url && /\/pull\/\d+/.test(r.url))) return r.url; return null }

// Plain-language state from what the workers actually did, not just whose turn it is.
function nowState(t, msgs, x) {
  const last = msgs[0], first = s => String(s || '').split('\n').find(l => l.trim()) || ''
  const pr = prOf([...msgs.flatMap(m => m.refs || []), ...(t.refs || [])])
  const st = { cls: '', label: '', detail: '', next: '', pr }
  if (t.status === 'blocked') return Object.assign(st, { cls: 'bad', label: 'Blocked', detail: first(last && last.body).slice(0, 160), next: 'Answer what it needs, then hand it back.' })
  if (t.turn === 'spitz') {
    st.label = 'Waiting on you'; st.cls = 'you'
    st.detail = last ? `${WHO[last.author] || last.author} handed it to you ${ago(last.created_at)}` : 'New task'
    st.next = last && last.kind === 'question' ? 'Answer the question, then hand it back.'
      : pr ? `Review PR ${(pr.match(/\/pull\/(\d+)/) || [,''])[1]}. To put it live, say "push it" to Claude in chat.`
      : 'Reply, hand it on, or mark it done.'
    return st
  }
  const run = x && x.run, wake = x && x.wake
  if (t.turn === 'chatgpt_chat') return Object.assign(st, { label: 'Waiting on your ChatGPT chat', detail: 'nothing starts by itself', next: 'Open it in ChatGPT when you are ready.' })
  if (t.turn === 'claude_thread') return Object.assign(st, { label: 'A Claude thread has it', detail: 'no worker is woken', next: 'The thread reports back in your Claude project.' })
  if (t.turn === 'openai_worker') {
    const rs = runState(t, run, x && x.gptwake)
    if (rs) return Object.assign(st, rs)
    Object.assign(st, { label: 'Queued for ChatGPT', detail: 'assigned, not started yet', next: 'It usually starts within a minute. If not, run it now.', run: true })
  } else {
    if (!x) return Object.assign(st, { label: "Claude's turn", detail: 'worker status shows once the dashboard update is applied', next: 'You get a notification when Claude hands off.' })
    if (wake && wake.version === t.version) {
      if (wake.waiting) Object.assign(st, { cls: 'work', label: 'Waking Claude', detail: `sent ${ago(wake.at)}` })
      else if (x.read && x.read.claude) Object.assign(st, { cls: 'work', label: 'Claude is working', detail: `opened the task ${clockS(x.read.claude)}, no reply yet`, next: 'You get a notification when Claude hands off.' })
      else if (wake.code >= 200 && wake.code < 300) {
        Object.assign(st, { cls: 'work', label: 'Wake accepted, Claude has not opened the task yet', detail: `accepted ${clockS(wake.at)}`, next: 'Claude usually opens it within a few minutes.' })
        if (mins(wake.at) > 10) Object.assign(st, { cls: 'warn', next: 'Not opened after 10 minutes. Its Sprite Drop sign-in may have expired: reconnect it in Claude.' })
      } else Object.assign(st, { cls: 'warn', label: 'Wake failed, retrying', detail: `last try ${ago(wake.at)}`, next: 'It retries up to 3 times, then the hourly check picks it up.' })
    } else if (x.read && x.read.claude) Object.assign(st, { cls: 'work', label: 'Claude is working', detail: `opened the task ${clockS(x.read.claude)}, no reply yet` })
    else Object.assign(st, { label: 'Queued for Claude', detail: 'not woken yet', next: 'The hourly check (6 AM to 10 PM) picks it up at :07.' })
  }
  if (mins(t.updated_at) > 30 && st.cls !== 'bad' && !st.live && st.cls !== 'warn') Object.assign(st, { cls: 'warn', detail: st.detail + ` · no movement for ${Math.round(mins(t.updated_at))} min` })
  if (x && x.handoffs >= 8) st.next = `Passed back and forth ${x.handoffs} times without you. Open it and decide.`
  return st
}

      <h2 class="nt">${esc(t.title)}</h2>

      ${s.next ? `<div class="next ${t.turn === 'spitz' || s.cls === 'bad' || s.cls === 'warn' ? 'hot' : ''}">Next: ${esc(s.next)}</div>` : ''}
      <div class="nb2 ${img ? '' : 'noimg'}">

          <button class="lnk" data-open="${t.id}">Full history${tm.length ? ` (${tm.length} message${tm.length === 1 ? '' : 's'})` : ''} →</button></div>

  })
}

// Retry a stopped ChatGPT run: the database keeps saved pictures and only reruns the unfinished step
async function retryRun(btn, out) {
  btn.disabled = true; out.textContent = 'Retrying...'
  const { data, error } = await sb.rpc('studio_retry_run', { p_run_id: Number(btn.dataset.retry) })
  out.innerHTML = error ? `<span class="err">${esc(error.message)}</span>` : data && data.retried ? 'Retrying. Progress shows here as it happens.' : esc((data && data.reason) || 'Not retried.')
  if (!error && data && data.retried) { nowLive = true; setTimeout(load, 2500) } else btn.disabled = false
}

// Opens a new chat with the instruction already typed in, so one click (plus Enter, if the app asks) starts that bot on this task.
const startUrl = (who, t) => {
  const msg = `check Task Drop: task ${t.id} ("${t.title}"). Read it with get_task and do your turn.`
  return (who === 'chatgpt' ? 'https://chatgpt.com/?q=' : 'https://claude.ai/new?q=') + encodeURIComponent(msg)
}

  const msgs = (msgs0 || []).map(norm)
  if (openId !== id) return
  if (error) { d.querySelector('.sub').innerHTML = `<span class="err">${esc(error.message)}</span>`; return }
  // images: anything referenced by the task or its messages, plus anything dropped onto this task
  const refIds = [...t.refs, ...msgs.flatMap(m => m.refs)].filter(r => r.type === 'asset').map(r => r.id)
  let assets = []
  const q1 = await sb.from('studio_assets').select('id,task_id,file_name,width,height,size_bytes,note,path,created_at').eq('task_id', id)
  assets = q1.data || []
  const missing = [...new Set(refIds)].filter(a => !assets.some(x => x.id === a))
  if (missing.length) { const q2 = await sb.from('studio_assets').select('id,task_id,file_name,width,height,size_bytes,note,path,created_at').in('id', missing); assets = assets.concat(q2.data || []) }
  const urls = {}
  if (assets.length) { const u = await signedUrls(assets); assets.forEach(a => { if (u(a.id)) urls[a.id] = u(a.id) }) }
  const [{ data: runs }, act] = await Promise.all([
    sb.from('studio_worker_runs').select('id,status,detail,created_at,finished_at,step,heartbeat_at,task_version,done_assets,pics:plan->images').eq('task_id', id).order('id', { ascending: false }).limit(1),
    sb.rpc('studio_task_activity', { p_task_id: id })])
  if (openId !== id) return
  const r0 = (runs || [])[0], events = ((act && !act.error && act.data) || []).map(norm)
  const run = r0 && { id: r0.id, status: r0.status, detail: r0.detail, at: r0.created_at, finished: r0.finished_at, step: r0.step, heartbeat: r0.heartbeat_at, version: r0.task_version, pictures: (r0.pics || []).length, saved: (r0.done_assets || []).length }
  const gw = events.find(e => e.actor === 'openai_worker' && e.kind === 'wake')
  const rs = runState(t, run, gw && { at: gw.at, code: gw.wake_code, waiting: gw.wake_pending, error: gw.wake_error })
  drawerLive = !!(rs && rs.live)
  const RUN = { started: 'ChatGPT is working on it', ok: 'ChatGPT finished', error: 'ChatGPT hit a problem', skipped: 'ChatGPT skipped', stalled: 'ChatGPT stopped' }

    : run ? `${RUN[run.status] || run.status} · ${ago(run.finished || run.at)}` : ''

  const refsHtml = refs => {
    const imgs = refs.filter(r => r.type === 'asset' && byId[r.id]).map(r => thumb(byId[r.id])).join('')
    const links = refs.filter(r => r.type !== 'asset').map(r => `<div><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.type === 'pr' ? 'Pull request ' + (r.url.match(/\/pull\/(\d+)/) || [,''])[1] : r.url)}</a></div>`).join('')

      ${m.set_turn ? `<span>→ ${esc(WHO[m.set_turn] || m.set_turn)}'s turn</span>` : ''}${m.set_status ? `<span>· marked ${esc(m.set_status)}</span>` : ''}</div>
      <div class="pre">${linkify(m.body)}</div>${refsHtml(m.refs)}</div>`

  if (quiet && d.dataset.sig === sig && d.dataset.task === id) return

      <div class="sub">${esc(t.project)} · ${turnTxt} · started by ${esc(WHO[t.created_by] || t.created_by)} ${ago(t.created_at)}</div>
      <div class="row start">${rs && rs.retry ? `<button class="btn gpt" id="retry" data-retry="${rs.retry}">Retry</button>` : gptTurn && !(rs && (rs.live || rs.hold)) ? '<button class="btn gpt" id="run">▶ run ChatGPT now</button>' : ''}<a class="btn gpt" target="_blank" rel="noopener" href="${startUrl('chatgpt', t)}">open in ChatGPT</a><a class="btn cl" target="_blank" rel="noopener" href="${startUrl('claude', t)}">▶ start Claude</a></div>${runTxt ? `<div class="sub" id="rs">${runTxt}</div>` : '<div class="sub" id="rs"></div>'}</div><button class="btn" id="x">Close</button></div>
    <div class="dbody"><details class="brief" ${msgs.length ? '' : 'open'}><summary>Brief</summary><div class="pre">${linkify(t.brief)}</div>${briefRefs}</details>
      ${timeline || '<p class="sub">No messages yet.</p>'}
      ${loose.length ? `<div class="msg"><div class="h">Other images on this task</div><div class="thumbs">${loose.map(thumb).join('')}</div></div>` : ''}</div>

  d.querySelector('#x').onclick = closeTask

  const ta = d.querySelector('#body'); ta.value = draft
  d.querySelectorAll('.compose .btn').forEach(b => b.onclick = () => post(t, b.dataset.a))
  const db = d.querySelector('.dbody')
  if (keep) {
    if (keep.brief !== undefined) d.querySelector('details.brief').open = keep.brief
    db.scrollTop = keep.atTop ? 0 : keep.top
    if (keep.focus) { ta.focus({ preventScroll: true }); try { ta.setSelectionRange(keep.a, keep.b) } catch (e) {} }
  } else db.scrollTop = 0
}

async function post(t, action) {
  const d = document.getElementById('drawer')
  return sendMsg(t, action, d.querySelector('#body'), d.querySelector('#cs'), d.querySelectorAll('.compose .btn'))
}
async function sendMsg(t, action, ta, cs, btns, onSent) {
  let body = ta.value.trim()
  if (!body) {
    if (action === 'done') body = 'Marked done.'
    else if (action === 'reopen') body = 'Reopened.'
    else if (action === 'note') { cs.innerHTML = '<span class="err">Write something first.</span>'; return }
    else body = `Over to ${WHO[action]}.`
  }
  const args = { p_task_id: t.id, p_request_key: key(), p_kind: action === 'done' ? 'decision' : 'note', p_body: body, p_refs: [] }
  if (['openai_worker', 'chatgpt_chat', 'claude', 'claude_thread'].includes(action)) Object.assign(args, { p_set_turn: oid(action), p_set_status: t.status === 'done' ? 'open' : null, p_expected_version: t.version })
  if (action === 'done') Object.assign(args, { p_set_status: 'done', p_expected_version: t.version })
  if (action === 'reopen') Object.assign(args, { p_set_status: 'open', p_set_turn: oid('spitz'), p_expected_version: t.version })
  busy = true; btns.forEach(b => b.disabled = true); cs.textContent = 'Sending...'
  const { data, error } = await sb.rpc('studio_post_message', args)
  busy = false; btns.forEach(b => b.disabled = false)
  if (error) { cs.innerHTML = `<span class="err">${esc(/client_id|connected app/.test(error.message) ? 'Replies from the dashboard are not switched on yet (the database update still needs to be applied).' : error.message)}</span>`; return }
  if (data && data.conflict) { cs.innerHTML = '<span class="err">Someone posted first. Here is the latest; try again.</span>'; await load(); return }
  ta.value = ''; if (onSent) onSent(); cs.innerHTML = '<span class="ok">Sent.</span>'
  ta.blur(); await load()
}

function newTask() {
  const projects = [...new Set(tasks.map(t => t.project))].sort()
  openId = null; document.body.classList.add('open')
  const d = document.getElementById('drawer')
  d.innerHTML = `<div class="dhead"><div class="grow"><h3>New task</h3><div class="sub">ChatGPT and Claude only see what you write here, so include everything they need.</div></div><button class="btn" id="x">Close</button></div>
    <form class="dbody" id="nf">
      <label class="field"><span>Project (lowercase, like rook-and-ruin)</span><input id="np" required pattern="[a-z0-9][a-z0-9-]{0,39}" list="pl" value="${esc(project !== 'all' ? project : projects[0] || '')}"><datalist id="pl">${projects.map(p => `<option value="${esc(p)}">`).join('')}</datalist></label>
      <label class="field"><span>Title</span><input id="nt" required maxlength="200"></label>
      <label class="field"><span>Brief: the goal, the rules, and what to send back</span><textarea id="nb" required maxlength="8000"></textarea></label>
      <label class="field"><span>Who goes first</span><select id="nw"><option value="openai_worker">ChatGPT worker (starts at once)</option>${IDV >= 2 ? '<option value="chatgpt_chat">My ChatGPT chat (waits for me)</option>' : ''}<option value="claude">Claude worker (starts at once)</option></select></label>
      <div class="row"><button class="btn primary" type="submit">Create task</button><span id="ns"></span></div></form>`
  d.querySelector('#x').onclick = closeTask
  d.querySelector('#nf').onsubmit = async e => {
    e.preventDefault(); const ns = d.querySelector('#ns'); ns.textContent = 'Creating...'
    const { data, error } = await sb.rpc('studio_create_task', { p_request_key: key(), p_project: d.querySelector('#np').value.trim(), p_title: d.querySelector('#nt').value.trim(), p_brief: d.querySelector('#nb').value.trim(), p_turn: oid(d.querySelector('#nw').value), p_refs: [] })
    if (error) { ns.innerHTML = `<span class="err">${esc(/client_id|connected app/.test(error.message) ? 'Creating tasks from the dashboard is not switched on yet (the database update still needs to be applied).' : error.message)}</span>`; return }
    await load(); renderTask(data.task.id)
  }
}
</script>
